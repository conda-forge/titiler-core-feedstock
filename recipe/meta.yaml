{% set name = "titiler" %}
{% set version = "2.2.1" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-core/{{ name }}_core-{{ version }}.tar.gz
    sha256: 61bd6fe35e766795ec9acc2ad58351426802e8ee6d06925724d3084fc20a53ed
    folder: titiler_core
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-xarray/{{ name }}_xarray-{{ version }}.tar.gz
    sha256: f7d11a38bcc3cbe68377c93d2e28768838f6a03e7abd3ce772e45b75d6d94315
    folder: titiler_xarray
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-extensions/{{ name }}_extensions-{{ version }}.tar.gz
    sha256: cb2e7f100299625e73b97e00d5da54914bcda56c897c1d70df46e222db38512e
    folder: titiler_extensions
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-mosaic/{{ name }}_mosaic-{{ version }}.tar.gz
    sha256: fccf7f502585b8584dd900e4db92f46be8594aea8cc47cfa56309b0c919eb3ec
    folder: titiler_mosaic
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-application/{{ name }}_application-{{ version }}.tar.gz
    sha256: 13425c9a472bbf7b017b6739a86f07d1c680e0a178b7f75be5d8044ec3105878
    folder: titiler_application

build:
  number: 0
  noarch: python

outputs:
  - name: titiler-core
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_core
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - fastapi >=0.136.1
        - geojson-pydantic >=1.1.2,<3.0
        - jinja2 >=2.11.2,<4.0.0
        - numpy
        - pydantic ~=2.0
        - rasterio
        - rio-tiler >=9.0,<10.0
        - morecantile
        - simplejson
        - python >={{ python_min }}
    test:
      imports:
        - titiler
        - titiler.core
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-xarray
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_xarray
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - xarray
        - rioxarray
        - obstore
        - zarr >=3.1,<4.0
        - starlette-cramjam >=0.4,<1.0
        - pydantic-settings ~=2.0
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.xarray
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-extensions
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_extensions
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.extensions
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-mosaic
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_mosaic
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        # TODO Package this on conda-forge
        # This is an extra dependency on PyPi
        # Should we add it here or add yet another output titiler-mosaic-json?
        # - cogeo-mosaic
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.mosaic
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-application
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_application
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - titiler-xarray
        - titiler-extensions
        - titiler-mosaic
        - starlette-cramjam
        - pydantic-settings ~=2.0
        - starlette-cramjam >=0.4,<1.0
        - python >={{ python_min }}
        # titiler-application depends on titiler-core[telemetry] extra
        - opentelemetry-api
        - opentelemetry-sdk
        - opentelemetry-instrumentation-fastapi
        - opentelemetry-instrumentation-logging
        - opentelemetry-exporter-otlp
        # titiler-application depends on titiler-extensions[cogeo,stac]
        - rio-stac >=0.12,<0.13
        - rio-cogeo >=7.0,<8.0
        # titiler-application depends on titiler-mosaic[mosaicjson]
        - cogeo-mosaic >=9.0,<10.0
      run_constrained:
        - titiler-core ={{ version }}
        - titiler-xarray ={{ version }}
        - titiler-extensions ={{ version }}
        - titiler-mosaic ={{ version }}
    test:
      imports:
        - titiler
        - titiler.application
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

about:
  home: https://github.com/developmentseed/titiler
  summary: A modern dynamic tile server built on top of FastAPI and Rasterio/GDAL.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - martinRenou
    - tylere
    - rsignell-usgs
