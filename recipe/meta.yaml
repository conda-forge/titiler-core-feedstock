{% set name = "titiler" %}
{% set version = "2.2.0" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-core/{{ name }}_core-{{ version }}.tar.gz
    sha256: 860698dd48ffb1c72732f35d54c0a1389d8ed3fdbfb7198dae5dc344a53fd0bc
    folder: titiler_core
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-xarray/{{ name }}_xarray-{{ version }}.tar.gz
    sha256: 9f63f5870b2dfed617b34a067b1085359f4d0ea4313ba5eb7be234f69fbda64f
    folder: titiler_xarray
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-extensions/{{ name }}_extensions-{{ version }}.tar.gz
    sha256: 7168c5ad9b7204797d06f23bbdab851e35477a68368014bd4054ee9a058c5559
    folder: titiler_extensions
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-mosaic/{{ name }}_mosaic-{{ version }}.tar.gz
    sha256: 51f4bccdce32f91388cbe2b91c35beb7d11efe3886e0f1073e35197e47673a13
    folder: titiler_mosaic
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-application/{{ name }}_application-{{ version }}.tar.gz
    sha256: af38bfe6b04f64083e233dc87ab28d602de39a79f728db31a4a90c2bb501711c
    folder: titiler_application

build:
  number: 0
  noarch: python

outputs:
  - name: titiler-core
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_core
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - fastapi >=0.136.1
        - geojson-pydantic >=1.1.2,<3.0
        - jinja2 >=2.11.2,<4.0.0
        - numpy
        - pydantic ~=2.0
        - rasterio
        - rio-tiler >=9.0,<10.0
        - morecantile
        - simplejson
        - python >={{ python_min }}
    test:
      imports:
        - titiler
        - titiler.core
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-xarray
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_xarray
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - xarray
        - rioxarray
        - obstore
        - zarr >=3.1,<4.0
        - starlette-cramjam >=0.4,<1.0
        - pydantic-settings ~=2.0
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.xarray
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-extensions
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_extensions
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.extensions
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-mosaic
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_mosaic
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        # TODO Package this on conda-forge
        # This is an extra dependency on PyPi
        # Should we add it here or add yet another output titiler-mosaic-json?
        # - cogeo-mosaic
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.mosaic
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-application
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_application
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - titiler-xarray
        - titiler-extensions
        - titiler-mosaic
        - starlette-cramjam
        - pydantic-settings ~=2.0
        - starlette-cramjam >=0.4,<1.0
        - python >={{ python_min }}
        # titiler-application depends on titiler-core[telemetry] extra
        - opentelemetry-api
        - opentelemetry-sdk
        - opentelemetry-instrumentation-fastapi
        - opentelemetry-instrumentation-logging
        - opentelemetry-exporter-otlp
        # titiler-application depends on titiler-extensions[cogeo,stac]
        - rio-stac >=0.12,<0.13
        - rio-cogeo >=7.0,<8.0
        # titiler-application depends on titiler-mosaic[mosaicjson]
        - cogeo-mosaic >=9.0,<10.0
      run_constrained:
        - titiler-core ={{ version }}
        - titiler-xarray ={{ version }}
        - titiler-extensions ={{ version }}
        - titiler-mosaic ={{ version }}
    test:
      imports:
        - titiler
        - titiler.application
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

about:
  home: https://github.com/developmentseed/titiler
  summary: A modern dynamic tile server built on top of FastAPI and Rasterio/GDAL.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - martinRenou
    - tylere
    - rsignell-usgs
