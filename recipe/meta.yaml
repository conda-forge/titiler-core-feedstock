{% set name = "titiler" %}
{% set version = "2.4.1" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}-core/{{ name }}_core-{{ version }}.tar.gz
    sha256: bfc688f82bd3c93ca5a37fad32cbadcb337a7346d53b356db23bdc4f843ac786
    folder: titiler_core
  - url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}-xarray/{{ name }}_xarray-{{ version }}.tar.gz
    sha256: b4f4e44d337081dbdb4f303178363e5bbb384928b142fca4f082181bcd8b75ca
    folder: titiler_xarray
  - url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}-extensions/{{ name }}_extensions-{{ version }}.tar.gz
    sha256: c775ba5eda1178c35d70de881ddb515f788f244115b417f232ab57b4abd6c4a8
    folder: titiler_extensions
  - url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}-mosaic/{{ name }}_mosaic-{{ version }}.tar.gz
    sha256: 9929d0d0c42f40957017613cbc2cc6659a360280aff6584dbe65b7f46e4a7180
    folder: titiler_mosaic
  - url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}-application/{{ name }}_application-{{ version }}.tar.gz
    sha256: 97c4fc5b57f9b38398669f7496cb478a559839fda241568f9609303468427363
    folder: titiler_application

build:
  number: 0
  noarch: python

outputs:
  - name: titiler-core
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_core
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - fastapi >=0.136.1
        - geojson-pydantic >=1.1.2,<3.0
        - jinja2 >=2.11.2,<4.0.0
        - numpy
        - pydantic ~=2.0
        - rasterio
        - rio-tiler >=9.0,<10.0
        - morecantile
        - simplejson
        - python >={{ python_min }}
    test:
      imports:
        - titiler
        - titiler.core
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-xarray
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_xarray
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - xarray
        - rioxarray
        - obstore
        - zarr >=3.1,<4.0
        - starlette-cramjam >=0.4,<1.0
        - pydantic-settings ~=2.0
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.xarray
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-extensions
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_extensions
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.extensions
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-mosaic
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_mosaic
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        # TODO Package this on conda-forge
        # This is an extra dependency on PyPi
        # Should we add it here or add yet another output titiler-mosaic-json?
        # - cogeo-mosaic
        - python >={{ python_min }}
      run_constrained:
        - titiler-core ={{ version }}
    test:
      imports:
        - titiler
        - titiler.mosaic
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

  - name: titiler-application
    version: {{ version }}
    build:
      noarch: python
      script: |
        cd titiler_application
        python -m pip install . -vv --no-deps --no-build-isolation --ignore-installed --no-index
    requirements:
      host:
        - hatchling
        - pip
        - python {{ python_min }}
      run:
        - titiler-core
        - titiler-xarray
        - titiler-extensions
        - titiler-mosaic
        - starlette-cramjam
        - pydantic-settings ~=2.0
        - starlette-cramjam >=0.4,<1.0
        - python >={{ python_min }}
        # titiler-application depends on titiler-core[telemetry] extra
        - opentelemetry-api
        - opentelemetry-sdk
        - opentelemetry-instrumentation-fastapi
        - opentelemetry-instrumentation-logging
        - opentelemetry-exporter-otlp
        # titiler-application depends on titiler-extensions[cogeo,stac]
        - rio-stac >=0.12,<0.13
        - rio-cogeo >=7.0,<8.0
        # titiler-application depends on titiler-mosaic[mosaicjson]
        - cogeo-mosaic >=9.0,<10.0
      run_constrained:
        - titiler-core ={{ version }}
        - titiler-xarray ={{ version }}
        - titiler-extensions ={{ version }}
        - titiler-mosaic ={{ version }}
    test:
      imports:
        - titiler
        - titiler.application
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}

about:
  home: https://github.com/developmentseed/titiler
  summary: A modern dynamic tile server built on top of FastAPI and Rasterio/GDAL.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - martinRenou
    - tylere
    - rsignell-usgs
